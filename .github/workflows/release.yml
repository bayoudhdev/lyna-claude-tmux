name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Never cancel a release half-way through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.x"
  GOTOOLCHAIN: local
  GORELEASER_VERSION: v2.18.1

jobs:
  # Tags are cut from a green main, so the gate runs once more on the tagged
  # commit itself: nothing is published unless the whole of CI passes there.
  verify:
    name: gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: goreleaser release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The only job with write access: contents to publish the release,
    # id-token and attestations to sign build provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      # --draft (which overrides release.draft in the configuration) uploads
      # the archives, packages, SBOMs and checksums to a release that stays
      # invisible until it has been attested.
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: the Homebrew cask is published only when this is set.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt
      # Last step on purpose: a release is public only once the attestation
      # SECURITY.md promises exists. A failure above leaves a draft, which a
      # maintainer deletes or re-runs.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
