# lmux plugin mode. Generated by `lmux plugin tmux --write`; do not edit.
# Source it from your tmux configuration: source-file <this file>
bind-key -T prefix y run-shell -b '/home/dev/.local/bin/lmux popup launch --pane #{pane_id} --client #{q:client_name}'
bind-key -T prefix u run-shell -b '/home/dev/.local/bin/lmux popup agents --pane #{pane_id} --client #{q:client_name}'
set-hook -g 'alert-bell[91]' 'run-shell -b '\''/home/dev/.local/bin/lmux bell-forward #{q:hook_session}'\'''
