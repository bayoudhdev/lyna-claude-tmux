set-option -wg pane-border-format '#{?#{pane_active},#[fg=color77]#[bold],#[fg=color102]#[nobold]} #{?#{==:#{@lt_role},claude},✻ claude,#{?#{==:#{@lt_role},review},± review,#{?#{==:#{@lt_role},changes},± changes,#{?#{==:#{@lt_role},scratch},› scratch,› shell}}}}#{?#{pane_dead},#[fg=color203]#[bold] ◆ exited#{?#{!=:#{pane_dead_status},}, #{pane_dead_status},},#{?#{==:#{@lt_state},waiting},#[fg=color203]#[bold] ◆ needs you,#{?#{==:#{@lt_state},busy},#[fg=color214] ● working,#{?#{==:#{@lt_state},idle},#[fg=color77] ○ idle,}}}#{?#{&&:#{@lt_subagents},#{!=:#{@lt_subagents},0}},#[fg=color102] +#{@lt_subagents} subagents,}}#[default] '
set-option -wg popup-style bg=color233,fg=color255
set-option -wg popup-border-style fg=color77
set-option -wg popup-border-lines rounded
set-option -wg clock-mode-color color77
set-option -g display-panes-active-color color77
