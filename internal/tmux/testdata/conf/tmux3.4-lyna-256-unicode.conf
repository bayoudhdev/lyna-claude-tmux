set-option -wg window-status-format '#[bg=color233]#[fg=color102] #{?#{m:*x*,#{P:#{?#{==:#{@lt_state},waiting},x,}}},#[fg=color203]◆ ,#{?#{m:*x*,#{P:#{?#{==:#{@lt_state},busy},x,}}},#[fg=color214]● ,#{?#{m:*x*,#{P:#{?#{==:#{@lt_state},idle},x,}}},#[fg=color77]○ ,}}}#[fg=color102]#I#[fg=color237]:#[fg=color102]#W#{?#{window_zoomed_flag}, [z],} '
