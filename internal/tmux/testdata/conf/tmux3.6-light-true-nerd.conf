bind-key -T prefix A run-shell -C '#{@lt_do_agents_rail}'
bind-key -T prefix g display-popup -E -w 95% -h 95% -d '#{pane_current_path}' -T ' review ' '/home/dev/.local/bin/lmux review --popup'
bind-key -T prefix G run-shell -C '#{@lt_do_git_work}'
bind-key -T prefix S display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T ' scratch '
bind-key -T prefix Space run-shell -C '#{@lt_do_menu_keys}'
bind-key -T prefix r source-file /home/dev/.local/state/lyna-tmux/tmux.conf \; display-message 'lyna-tmux: configuration reloaded'
bind-key -T prefix d detach-client

# mouse
bind-key -n MouseDown1Status run-shell -C '#{?#{==:#{mouse_status_range},split},#{@lt_do_split_right},#{?#{==:#{mouse_status_range},agents},#{@lt_do_agents},#{?#{==:#{mouse_status_range},review},#{@lt_do_review},#{?#{==:#{mouse_status_range},menu},#{@lt_do_menu_session},#{?#{==:#{mouse_status_range},sandbox},#{@lt_do_sandbox},select-window -t =}}}}}'
bind-key -n SecondClick1Status run-shell -C '#{?#{==:#{mouse_status_range},split},#{@lt_do_split_right},#{?#{==:#{mouse_status_range},agents},#{@lt_do_agents},#{?#{==:#{mouse_status_range},review},#{@lt_do_review},#{?#{==:#{mouse_status_range},menu},#{@lt_do_menu_session},#{?#{==:#{mouse_status_range},sandbox},#{@lt_do_sandbox},select-window -t =}}}}}'
bind-key -n MouseDown1StatusLeft run-shell -C '#{@lt_do_menu_session}'
bind-key -n SecondClick1StatusLeft run-shell -C '#{@lt_do_menu_session}'
bind-key -n MouseDown3StatusLeft run-shell -C '#{@lt_do_menu_session}'
bind-key -n SecondClick3StatusLeft run-shell -C '#{@lt_do_menu_session}'
bind-key -n MouseDown3Status run-shell -C '#{@lt_do_menu_window}'
bind-key -n SecondClick3Status run-shell -C '#{@lt_do_menu_window}'
bind-key -n MouseDown3Pane if-shell -F -t = '#{mouse_any_flag}' 'select-pane -t = ; send-keys -M -t =' 'select-pane -t = ; run-shell -C '\''#{@lt_do_menu_pane}'\'''
bind-key -n SecondClick3Pane if-shell -F -t = '#{mouse_any_flag}' 'select-pane -t = ; send-keys -M -t =' 'select-pane -t = ; run-shell -C '\''#{@lt_do_menu_pane}'\'''
bind-key -n M-MouseDown3Pane select-pane -t = \; run-shell -C '#{@lt_do_menu_pane}'
bind-key -n M-SecondClick3Pane select-pane -t = \; run-shell -C '#{@lt_do_menu_pane}'

