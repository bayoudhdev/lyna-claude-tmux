# lyna-tmux generated configuration for tmux 3.6. Do not edit: it is rewritten.

# terminal
set-option -s default-terminal tmux-256color
set-option -s 'terminal-features[90]' '*:extkeys'
set-option -s 'terminal-features[91]' '*:RGB'
set-option -s extended-keys on
set-option -s extended-keys-format csi-u
set-option -s escape-time 10
set-option -s focus-events off
set-option -s set-clipboard external

# behavior
set-option -g history-limit 100000
set-option -g base-index 1
set-option -wg pane-base-index 1
set-option -g renumber-windows on
set-option -g mouse on
set-option -g status-interval 5
set-option -g display-time 2000
set-option -g set-titles on
set-option -g set-titles-string '#S: #W'
set-option -wg allow-rename off
set-option -wg allow-passthrough off
set-option -wg allow-set-title off
set-option -wg aggressive-resize on
set-option -wg monitor-bell on
set-option -g bell-action any
set-option -g visual-bell off
set-option -g prefix C-b
set-option -g prefix2 None

# look
set-option -g status-position top
set-option -g status-justify left
set-option -g status-style 'bg=#f6f8fa,fg=#1f2328'
set-option -g status-left-length 56
set-option -g status-right-length 160
set-option -g status-left '#[bg=#1a7f37]#[fg=#f6f8fa]#[bold] 󰘦 #[bg=#eaeef2]#[fg=#1a7f37]#[fg=#1f2328]#[nobold] #S #[bg=#f6f8fa]#[fg=#eaeef2]#[fg=#57606a]'
set-option -g status-right '#[range=user|split]#[fg=#57606a]  split #[norange]#[range=user|review]#[fg=#57606a]  review #[norange]#[range=user|menu]#[fg=#57606a]  #[norange]#[bg=#f6f8fa]#[fg=#eaeef2]#[bg=#eaeef2]#[range=user|agents]#[fg=#57606a] #{?#{!=:#{n:#{S:#{W:#{P:#{?#{==:#{@lt_state},waiting},x,}}}}},0},#[fg=#cf222e]#[bold] #{n:#{S:#{W:#{P:#{?#{==:#{@lt_state},waiting},x,}}}}} waiting#[nobold],#[fg=#57606a]󰚩 #{n:#{S:#{W:#{P:#{?#{==:#{@lt_role},claude},x,}}}}}} #[norange]#{?#{@lt_managed},#[range=user|sandbox]#{?#{==:#{@lt_sandbox},off},#[bg=#eaeef2]#[fg=#cf222e]#[bg=#cf222e]#[fg=#f6f8fa]#[bold] 󰦞 sandbox off #[bg=#cf222e]#[fg=#eaeef2]#[bg=#eaeef2]#[nobold],#[fg=#d0d7de]#{?#{==:#{@lt_sandbox},strict},#[fg=#1a7f37] 󰕥 strict ,#[fg=#0969da] 󰕥 std }}#[norange],}#{?#{@lt_branch},#[fg=#d0d7de]#[fg=#0969da]  #{@lt_branch} ,}#[bg=#eaeef2]#[fg=#1a7f37]#[bg=#1a7f37]#[fg=#f6f8fa]  %H:%M '
