bind-key -T prefix C run-shell -C '#{?#{P:#{?#{==:#{@lt_role},claude},#{pane_id} ,}},select-pane -t #{s/ .*//:#{P:#{?#{==:#{@lt_role},claude},#{pane_id} ,}}},display-message '\''no Claude pane in this window'\''}'
