# lyna-tmux generated configuration for tmux 3.3a. Do not edit: it is rewritten.
# Put your own settings in /home/dev/.config/lyna-tmux/tmux.local.conf (sourced at the end).

# terminal
set-option -s default-terminal tmux-256color
set-option -s 'terminal-features[90]' '*:extkeys'
set-option -s 'terminal-features[91]' '*:RGB'
set-option -s extended-keys on
set-option -s escape-time 10
set-option -s focus-events off
set-option -s set-clipboard external

# behavior
set-option -g history-limit 100000
set-option -g base-index 1
set-option -wg pane-base-index 1
set-option -g renumber-windows on
set-option -g mouse on
set-option -g status-interval 5
set-option -g display-time 2000
set-option -g set-titles on
set-option -g set-titles-string '#S: #W'
set-option -wg allow-rename off
set-option -wg allow-passthrough off
set-option -wg aggressive-resize on
set-option -wg monitor-bell on
set-option -g bell-action any
set-option -g visual-bell off
set-option -g prefix C-b
set-option -g prefix2 None

# look
set-option -g status-position bottom
set-option -g status-justify left
set-option -g status-style 'bg=#0d1117,fg=#e6edf3'
set-option -g status-left-length 55
set-option -g status-right-length 160
set-option -g status-left '#[bg=#39d353]#[fg=#0d1117]#[bold] λ #[bg=#161b22]#[fg=#e6edf3]#[nobold] #S #[bg=#0d1117]#[fg=#7d8590] '
set-option -g status-right '#[fg=#7d8590] #{?#{!=:#{n:#{S:#{W:#{P:#{?#{==:#{@lt_state},waiting},x,}}}}},0},#[fg=#ff5f56]#[bold]◆ #{n:#{S:#{W:#{P:#{?#{==:#{@lt_state},waiting},x,}}}}} waiting#[nobold],#[fg=#7d8590]◎ #{n:#{S:#{W:#{P:#{?#{==:#{@lt_role},claude},x,}}}}}} #{?#{@lt_managed},#{?#{==:#{@lt_sandbox},off},#[bg=#ff5f56]#[fg=#0d1117]#[bold] ▢ sandbox off #[bg=#0d1117]#[nobold],#{?#{==:#{@lt_sandbox},strict},#[fg=#39d353] ▣ strict ,#[fg=#58a6ff] ▣ std }},}#{?#{@lt_branch},#[fg=#58a6ff] ⎇ #{@lt_branch} ,}#[bg=#161b22]#[fg=#e6edf3] ◷ %H:%M '
set-option -wg window-status-format '#[bg=#0d1117]#[fg=#7d8590] #{?#{m:*x*,#{P:#{?#{==:#{@lt_state},waiting},x,}}},#[fg=#ff5f56]◆ ,#{?#{m:*x*,#{P:#{?#{==:#{@lt_state},busy},x,}}},#[fg=#f0b72f]● ,#{?#{m:*x*,#{P:#{?#{==:#{@lt_state},idle},x,}}},#[fg=#39d353]○ ,}}}#[fg=#7d8590]#I#[fg=#30363d]:#[fg=#7d8590]#W#{?#{window_zoomed_flag}, [z],} '
set-option -wg window-status-current-format '#[bg=#161b22]#[fg=#39d353]#[bold] #{?#{m:*x*,#{P:#{?#{==:#{@lt_state},waiting},x,}}},#[fg=#ff5f56]◆ ,#{?#{m:*x*,#{P:#{?#{==:#{@lt_state},busy},x,}}},#[fg=#f0b72f]● ,#{?#{m:*x*,#{P:#{?#{==:#{@lt_state},idle},x,}}},#[fg=#39d353]○ ,}}}#[fg=#39d353]#I#[fg=#7d8590]:#[fg=#e6edf3]#W#{?#{window_zoomed_flag},#[fg=#f0b72f] [z],} #[nobold]'
set-option -wg window-status-separator ''
set-option -wg window-status-bell-style 'fg=#ff5f56,bold'
set-option -g message-style 'bg=#161b22,fg=#e6edf3'
set-option -g message-command-style 'bg=#161b22,fg=#39d353'
set-option -wg mode-style 'bg=#262d38,fg=#e6edf3'
set-option -wg pane-border-style 'fg=#30363d'
set-option -wg pane-active-border-style 'fg=#39d353'
set-option -wg pane-border-lines heavy
set-option -wg pane-border-indicators arrows
set-option -wg pane-border-status top
set-option -wg pane-border-format '#{?#{pane_active},#[fg=#39d353]#[bold],#[fg=#7d8590]#[nobold]} #{?#{==:#{@lt_role},claude},✻ claude,#{?#{==:#{@lt_role},teammate},◎ #{?#{@lt_agent},#{@lt_agent},teammate},#{?#{==:#{@lt_role},review},± review,#{?#{==:#{@lt_role},changes},± changes,#{?#{==:#{@lt_role},agents},◎ agents,#{?#{==:#{@lt_role},scratch},› scratch,› shell}}}}}}#{?#{pane_dead},#[fg=#ff5f56]#[bold] ◆ exited#{?#{!=:#{pane_dead_status},}, #{pane_dead_status},},#{?#{==:#{@lt_state},waiting},#[fg=#ff5f56]#[bold] ◆ needs you,#{?#{==:#{@lt_state},busy},#[fg=#f0b72f] ● working,#{?#{==:#{@lt_state},idle},#[fg=#39d353] ○ idle,}}}#{?#{&&:#{@lt_subagents},#{!=:#{@lt_subagents},0}},#[fg=#7d8590] +#{@lt_subagents} subagents,}}#[default] '
set-option -wg popup-style 'bg=#0d1117,fg=#e6edf3'
set-option -wg popup-border-style 'fg=#39d353'
set-option -wg popup-border-lines rounded
set-option -wg clock-mode-color '#39d353'
set-option -g display-panes-active-color '#39d353'
set-option -g display-panes-color '#7d8590'

