# keys
bind-key -T root 'M-[' select-pane -t :.-
bind-key -T root 'M-]' select-pane -t :.+
bind-key -T root M-S-Left resize-pane -L 5
bind-key -T root M-S-Right resize-pane -R 5
bind-key -T root M-S-Up resize-pane -U 3
bind-key -T root M-S-Down resize-pane -D 3
bind-key -T root 'M-\' split-window -h -c '#{pane_current_path}' \; set-option -p @lt_role shell
bind-key -T root M-- split-window -v -c '#{pane_current_path}' \; set-option -p @lt_role shell
