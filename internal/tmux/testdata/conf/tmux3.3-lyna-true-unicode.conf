bind-key -T root M-e choose-tree -Zs
bind-key -T root M-a display-popup -E -w 90% -h 85% -d '#{pane_current_path}' -T ' agents ' '/home/dev/.local/bin/lmux agents --popup'
bind-key -T root M-g display-popup -E -w 95% -h 95% -d '#{pane_current_path}' -T ' review ' '/home/dev/.local/bin/lmux review --popup'
bind-key -T root M-s display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T ' scratch '
bind-key -T root M-Space run-shell -C '#{@lt_do_menu_keys}'
bind-key -T prefix C-b send-prefix
