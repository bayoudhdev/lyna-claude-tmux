set-option -g @lt_do_agents 'display-popup -E -w 90% -h 85% -d '\''#{pane_current_path}'\'' -T '\'' agents '\'' '\''/home/dev/.local/bin/lmux agents --popup'\'''
set-option -g @lt_do_review 'display-popup -E -w 95% -h 95% -d '\''#{pane_current_path}'\'' -T '\'' review '\'' '\''/home/dev/.local/bin/lmux review --popup'\'''
set-option -g @lt_do_sandbox 'display-popup -E -w 90% -h 85% -d '\''#{pane_current_path}'\'' -T '\'' sandbox '\'' '\''/home/dev/.local/bin/lmux sandbox status --popup'\'''
